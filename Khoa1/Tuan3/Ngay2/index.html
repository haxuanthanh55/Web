<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
    .vip { color: red; font-weight: bold; }
    .examined { text-decoration: line-through; color: gray; background-color: #f8f9fa; }
    .btn-examined { color: white; background-color: green; margin-left: 15px; }
    .btn-cancel { color: white; background-color: red; margin-left: 5px; }
</style>

<form id="patient-form">
    <input type="text" id="patient-name" required placeholder="Nhập tên bệnh nhân...">
    <label>
        <input type="checkbox" id="is-vip"> Bệnh nhân ưu tiên
    </label>
    <button type="submit">Thêm vào hàng đợi</button>
</form>

<ul id="waiting-list">
    <!-- Cấu trúc HTML mẫu khi thêm 1 bệnh nhân -->
    <li>
        <span>BN01 - Nguyễn Văn A</span>
        <button class="btn-examined">Khám xong</button>
        <button class="btn-cancel">Hủy</button>
    </li>
</ul>
<script src="script.js"></script>
</body>
</html>
