<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Hồ sơ</title>
    <style>
        body { font-family: Arial; background: #f4f7f6; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; width: 350px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .data-row { margin-bottom: 10px; border-bottom: 1px dashed #ccc; padding-bottom: 5px; }
        button { background: #4ca1af; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; margin-top: 10px; width: 100%; }
    </style>
</head>
<body>

    <div class="card">
    <h2>Nhập Hồ Sơ Học Viên</h2>
    
    <!-- Dùng Checkbox để sinh ra giá trị Boolean (true/false) -->
    <label>
        <input type="checkbox" id="premiumInput"> Là thành viên Premium?
    </label><br><br>

    <!-- Ô nhập số. Nếu bỏ trống -> Xử lý thành Undefined -->
    <label>Điểm thi:</label>
    <input type="number" id="diemInput" placeholder="Bỏ trống nếu chưa thi"><br><br>

    <!-- Ô nhập chữ. Nếu bỏ trống -> Xử lý thành Null -->
    <label>Mã giảm giá:</label>
    <input type="text" id="maGiamGiaInput" placeholder="Bỏ trống nếu không có"><br><br>

    <button onclick="capNhatDuLieu()">Cập nhật hệ thống</button>

    <div id="hienThiHoSo" style="margin-top: 20px;"></div>
</div>

    <script src="bai1.js"></script>
</body>
</html>
